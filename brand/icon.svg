<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <metadata><![CDATA[
# ─────────────────────────────────────────────
#        ,,
#      <(@@)___     Patrick's nest
#       ( ._> /     quackomation for the homelab
#        `---'      hatched with love, waddles on HA
#
#  Muscovy Public License (a joke, not a license)
#  real one's in the LICENSE file. no feathers
#  were ruffled. this duck is legally un-binding
#  but will absolutely imprint on you.
# ─────────────────────────────────────────────
]]></metadata>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e3d8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeebe2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f7b500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b2a3a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(2 16) scale(0.92)">

  <!-- faceplate -->
  <rect x="112" y="84" width="288" height="412" rx="44" fill="url(#plate)" stroke="#cfc9ba" stroke-width="4" filter="url(#shadow)"/>

  <!-- buttons -->
  <g stroke="#d3cdbf" stroke-width="3">
    <rect x="152" y="140" width="208" height="70" rx="14" fill="url(#btn)"/>
    <rect x="152" y="228" width="208" height="70" rx="14" fill="url(#btn)"/>
    <rect x="152" y="316" width="208" height="70" rx="14" fill="url(#btn)"/>
    <rect x="152" y="404" width="98" height="52" rx="12" fill="url(#btn)"/>
    <rect x="262" y="404" width="98" height="52" rx="12" fill="url(#btn)"/>
  </g>

  <!-- engraving lines -->
  <g fill="#b9b2a2">
    <rect x="214" y="171" width="84" height="8" rx="4"/>
    <rect x="214" y="259" width="84" height="8" rx="4"/>
    <rect x="214" y="347" width="84" height="8" rx="4"/>
    <path d="M201 437 l-12 -14 h24 z"/>
    <path d="M311 423 l-12 14 h24 z"/>
  </g>

  <!-- LEDs: middle one lit -->
  <rect x="168" y="163" width="8" height="24" rx="4" fill="#cbc4b4"/>
  <circle cx="172" cy="263" r="34" fill="url(#glow)"/>
  <rect x="168" y="251" width="8" height="24" rx="4" fill="#ffb400"/>
  <rect x="168" y="339" width="8" height="24" rx="4" fill="#cbc4b4"/>

  <!-- duck perched on top -->
  <g>
    <ellipse cx="330" cy="70" rx="62" ry="40" fill="url(#duck)" stroke="#d99a00" stroke-width="4"/>
    <path d="M300 72 q30 26 66 2" fill="none" stroke="#d99a00" stroke-width="5" stroke-linecap="round"/>
    <circle cx="384" cy="34" r="34" fill="url(#duck)" stroke="#d99a00" stroke-width="4"/>
    <path d="M410 36 q30 -2 32 10 q-14 12 -34 6 z" fill="#ff8a1f" stroke="#e06a00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="393" cy="26" r="6.5" fill="#1d1d1f"/>
    <circle cx="395" cy="24" r="2.2" fill="#ffffff"/>
    <path d="M378 4 q4 -8 12 -4" fill="none" stroke="#d99a00" stroke-width="4" stroke-linecap="round"/>
  </g>
  </g>
</svg>
